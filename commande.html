<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Commander — Ferme des Val'Lands</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
          sans:  ['Outfit',   'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
        colors: {
          forest:    { 50:'#f3f6f1',100:'#e3ebde',200:'#c5d6bb',300:'#9eb98d',400:'#769962',500:'#587c46',600:'#436234',700:'#344c29',800:'#2a3d22',900:'#22311c' },
          cream:     { 50:'#fbf8f1',100:'#f6efe1',200:'#ece1c4',300:'#decea0',400:'#cdb479',500:'#bd9a59' },
          earth:     { 50:'#f8f4ee',100:'#ebe0cf',200:'#d3bfa1',300:'#b9a07b',400:'#9c8159',500:'#806842',600:'#604c2f',700:'#473722',800:'#312618',900:'#1f1810' },
          terracotta:{ 50:'#fdf1ec',100:'#fbdccf',200:'#f7b599',300:'#f28a63',400:'#ee6537',500:'#e74310',600:'#c5350c',700:'#9a290a',800:'#701d07',900:'#4a1305' },
        },
        keyframes: {
          spin: { to: { transform: 'rotate(360deg)' } },
        },
        animation: {
          spin: 'spin 1s linear infinite',
        },
      }
    }
  }
</script>

<style>
  html { scroll-behavior: smooth; }
  body { font-family: 'Outfit', sans-serif; background: #fbf8f1; color: #22311c; }
  .font-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
  :focus-visible { outline: 2px solid #587c46; outline-offset: 2px; }
  .ring-selected { box-shadow: 0 0 0 2px #436234; }
</style>
</head>
<body class="antialiased">
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useEffect, useRef, useState } = React;

// ─── Webhook URLs — remplacez par vos URLs n8n ───────────────────────────────
const GET_STOCK_URL  = "https://n8n.srv792132.hstgr.cloud/webhook/get-stock";
const POST_ORDER_URL = "https://n8n.srv792132.hstgr.cloud/webhook/post-order";

// ─── Catalogue produits ──────────────────────────────────────────────────────
const CAISSETTES = [
  {
    id: "caissette_5kg",
    label: "Découverte", weight: "5 kg", price: "≈ 95 €",
    pieces: "Steaks, bourguignon, haché",
    note: "Idéale pour découvrir.",
    stockKey: "caissette_5kg",
  },
  {
    id: "caissette_10kg",
    label: "Familiale", weight: "10 kg", price: "≈ 180 €",
    pieces: "Rôtis, côtes, mijoté, haché",
    note: "Notre format le plus demandé.",
    stockKey: "caissette_10kg",
    featured: true,
  },
  {
    id: "caissette_15kg",
    label: "Demi-bête", weight: "15 kg", price: "≈ 260 €",
    pieces: "Sélection complète, pièces nobles",
    note: "Pour les grandes tablées.",
    stockKey: "caissette_15kg",
  },
];

// ─── Icon (Lucide) ───────────────────────────────────────────────────────────
const Icon = ({ name, size = 20, strokeWidth = 1.6, className = "" }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !window.lucide?.icons?.[name]) return;
    ref.current.innerHTML = "";
    const svg = window.lucide.createElement(window.lucide.icons[name]);
    svg.setAttribute("width",  size);
    svg.setAttribute("height", size);
    svg.setAttribute("stroke-width", strokeWidth);
    if (className) svg.setAttribute("class", className);
    ref.current.appendChild(svg);
  }, [name, size, strokeWidth, className]);
  return <span ref={ref} className="inline-flex shrink-0" aria-hidden="true" />;
};

// ─── Badge stock ─────────────────────────────────────────────────────────────
const StockBadge = ({ qty, loading }) => {
  if (loading)
    return <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-earth-100 text-earth-400 animate-pulse">···</span>;
  if (qty === null) return null;
  if (qty === 0)
    return <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-terracotta-100 text-terracotta-700 font-medium tracking-wide">Épuisé</span>;
  if (qty <= 2)
    return <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-cream-200 text-earth-700 font-medium">Plus que {qty}</span>;
  return <span className="text-[11px] px-2.5 py-0.5 rounded-full bg-forest-100 text-forest-700 font-medium">{qty} disponibles</span>;
};

// ─── Carte caissette ─────────────────────────────────────────────────────────
const CaissetteCard = ({ product, stock, loading, selected, onSelect }) => {
  const qty     = loading ? null : (stock?.[product.stockKey] ?? null);
  const soldOut = !loading && qty !== null && qty === 0;
  const active  = selected === product.id;

  return (
    <button
      type="button"
      disabled={soldOut}
      onClick={() => onSelect(active ? null : product.id)}
      className={[
        "relative w-full text-left p-6 rounded-xl border-2 transition-all duration-200 focus:outline-none",
        soldOut  ? "opacity-50 cursor-not-allowed border-earth-200 bg-earth-50" :
        active   ? "border-forest-600 bg-forest-50 ring-selected" :
        product.featured ? "border-forest-300 bg-cream-50 hover:border-forest-500" :
                   "border-earth-200 bg-cream-50 hover:border-earth-300",
      ].join(" ")}
    >
      {product.featured && !soldOut && (
        <span className="absolute -top-3 left-5 bg-terracotta-500 text-cream-50 text-[10px] tracking-[0.2em] uppercase px-3 py-1 rounded-full">
          Recommandée
        </span>
      )}

      <div className="flex items-start justify-between gap-2">
        <div>
          <div className="text-[11px] uppercase tracking-[0.22em] text-earth-500 mb-1">{product.label}</div>
          <div className="font-display text-4xl text-forest-900 leading-none">{product.weight}</div>
          <div className="mt-2 font-display text-lg text-earth-600">{product.price}</div>
        </div>
        <div className="flex flex-col items-end gap-2 pt-0.5">
          <div className={[
            "w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all",
            active ? "border-forest-600 bg-forest-600" : "border-earth-300",
          ].join(" ")}>
            {active && <Icon name="Check" size={11} className="text-white" />}
          </div>
          <StockBadge qty={qty} loading={loading} />
        </div>
      </div>

      <div className="mt-4 pt-4 border-t border-earth-100">
        <div className="text-[11px] uppercase tracking-[0.18em] text-earth-400 mb-1.5">Composition</div>
        <div className="text-sm text-earth-700">{product.pieces}</div>
        <div className="mt-2 font-display italic text-sm text-forest-700">{product.note}</div>
      </div>
    </button>
  );
};

// ─── Sélecteur quantité ──────────────────────────────────────────────────────
const QuantityStepper = ({ value, onChange, max, disabled }) => (
  <div className="flex items-center gap-3">
    <button
      type="button"
      onClick={() => onChange(Math.max(0, value - 1))}
      disabled={disabled || value === 0}
      className="w-9 h-9 rounded-full border border-earth-300 bg-white flex items-center justify-center text-earth-700 hover:border-forest-500 hover:text-forest-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
    >
      <Icon name="Minus" size={14} />
    </button>
    <span className="font-display text-2xl w-8 text-center text-forest-900 select-none">{value}</span>
    <button
      type="button"
      onClick={() => onChange(Math.min(max, value + 1))}
      disabled={disabled || value >= max}
      className="w-9 h-9 rounded-full border border-earth-300 bg-white flex items-center justify-center text-earth-700 hover:border-forest-500 hover:text-forest-700 disabled:opacity-40 disabled:cursor-not-allowed transition"
    >
      <Icon name="Plus" size={14} />
    </button>
    {!disabled && max > 0 && (
      <span className="text-xs text-earth-400">{max} disponibles</span>
    )}
    {!disabled && max === 0 && (
      <span className="text-xs text-terracotta-600">Épuisé</span>
    )}
  </div>
);

// ─── Champ de formulaire ─────────────────────────────────────────────────────
const Field = ({ label, name, type = "text", value, onChange, error, required, placeholder, autoComplete }) => (
  <div>
    <label htmlFor={name} className="block text-sm font-medium text-forest-800 mb-1.5">
      {label}
      {required && <span className="text-terracotta-500 ml-0.5">*</span>}
    </label>
    <input
      id={name} name={name} type={type} value={value}
      onChange={e => onChange(e.target.value)}
      required={required} placeholder={placeholder} autoComplete={autoComplete}
      className={[
        "w-full px-4 py-3 rounded-lg border bg-white text-forest-900 placeholder-earth-300",
        "focus:outline-none focus:ring-2 focus:ring-forest-400 focus:border-transparent transition",
        error ? "border-terracotta-400 ring-1 ring-terracotta-200" : "border-earth-300 hover:border-earth-400",
      ].join(" ")}
    />
    {error && (
      <p className="mt-1.5 text-xs text-terracotta-600 flex items-center gap-1">
        <Icon name="AlertCircle" size={12} /> {error}
      </p>
    )}
  </div>
);

// ─── Écran de succès ─────────────────────────────────────────────────────────
const SuccessScreen = ({ prenom, caissette, steaks }) => (
  <div className="min-h-screen bg-cream-50 flex items-center justify-center px-6 py-16">
    <div className="max-w-lg w-full text-center">
      <div className="w-20 h-20 rounded-full bg-forest-100 mx-auto flex items-center justify-center mb-8">
        <Icon name="CheckCircle" size={42} strokeWidth={1.3} className="text-forest-600" />
      </div>
      <h1 className="font-display text-4xl lg:text-5xl text-forest-900 leading-[1.1] tracking-tight">
        Merci {prenom}&nbsp;!<br />
        <span className="italic text-forest-600">On revient vers vous vite.</span>
      </h1>
      <p className="mt-6 text-earth-700 text-lg leading-relaxed">
        Votre demande est bien enregistrée. Nous vous contacterons dans les 48 h
        pour confirmer la réservation et vous indiquer les modalités de paiement.
      </p>

      {(caissette || steaks > 0) && (
        <div className="mt-8 inline-flex flex-col gap-2 bg-forest-900 text-cream-50 px-7 py-5 rounded-2xl text-sm text-left">
          {caissette && (
            <div className="flex items-center gap-2.5">
              <Icon name="Package" size={16} strokeWidth={1.5} />
              <span>Caissette <strong>{caissette}</strong> réservée</span>
            </div>
          )}
          {steaks > 0 && (
            <div className="flex items-center gap-2.5">
              <Icon name="ShoppingBag" size={16} strokeWidth={1.5} />
              <span><strong>{steaks}</strong> pack{steaks > 1 ? "s" : ""} steak haché</span>
            </div>
          )}
        </div>
      )}

      <a href="index.html" className="mt-10 inline-flex items-center gap-2 text-forest-700 hover:text-forest-900 text-sm border-b border-forest-300 hover:border-forest-600 transition pb-0.5">
        <Icon name="ArrowLeft" size={15} /> Retour à l'accueil
      </a>
    </div>
  </div>
);

// ─── Formulaire principal ────────────────────────────────────────────────────
const OrderForm = () => {
  // Stock
  const [stock,        setStock]        = useState(null);
  const [stockLoading, setStockLoading] = useState(true);
  const [stockError,   setStockError]   = useState(false);

  // Champs
  const [prenom,    setPrenom]    = useState("");
  const [nom,       setNom]       = useState("");
  const [email,     setEmail]     = useState("");
  const [telephone, setTelephone] = useState("");

  // Produits
  const [caissette, setCaissette] = useState(null);
  const [steaks,    setSteaks]    = useState(0);

  // RGPD
  const [newsletterConsent, setNewsletterConsent] = useState(false);

  // Soumission
  const [errors,     setErrors]     = useState({});
  const [submitting, setSubmitting] = useState(false);
  const [submitted,  setSubmitted]  = useState(false);

  // Chargement du stock au montage
  useEffect(() => {
    const ctrl = new AbortController();
    fetch(GET_STOCK_URL, { signal: ctrl.signal })
      .then(r => { if (!r.ok) throw new Error("stock_error"); return r.json(); })
      .then(data => { setStock(data); setStockLoading(false); })
      .catch(err => {
        if (err.name !== "AbortError") { setStockError(true); setStockLoading(false); }
      });
    return () => ctrl.abort();
  }, []);

  const validate = () => {
    const e = {};
    if (!prenom.trim())    e.prenom    = "Prénom requis";
    if (!nom.trim())       e.nom       = "Nom requis";
    if (!email.trim())     e.email     = "Email requis";
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = "Format invalide";
    if (!telephone.trim()) e.telephone = "Téléphone requis";
    if (!caissette && steaks === 0)
      e.produit = "Sélectionnez au moins une caissette ou des steaks hachés.";
    return e;
  };

  const handleSubmit = async (ev) => {
    ev.preventDefault();
    const errs = validate();
    if (Object.keys(errs).length) { setErrors(errs); return; }
    setErrors({});
    setSubmitting(true);

    const payload = {
      prenom:              prenom.trim(),
      nom:                 nom.trim(),
      email:               email.trim().toLowerCase(),
      telephone:           telephone.trim(),
      caissette:           caissette ?? null,
      steaks_haches_qty:   steaks,
      newsletter_consent:  newsletterConsent,
      submitted_at:        new Date().toISOString(),
    };

    try {
      const res = await fetch(POST_ORDER_URL, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify(payload),
      });
      if (!res.ok) throw new Error();
      setSubmitted(true);
    } catch {
      setErrors({ submit: "Erreur réseau — veuillez réessayer ou nous appeler au 04 71 ·· ·· ··." });
    } finally {
      setSubmitting(false);
    }
  };

  if (submitted) {
    const label = CAISSETTES.find(c => c.id === caissette)?.weight ?? null;
    return <SuccessScreen prenom={prenom} caissette={label} steaks={steaks} />;
  }

  const steakQty = stockLoading ? 0 : (stock?.steaks_haches ?? 0);

  return (
    <div className="min-h-screen bg-cream-50">

      {/* ── En-tête ── */}
      <header className="bg-forest-900 text-cream-50 sticky top-0 z-40 shadow-md">
        <div className="max-w-3xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between">
          <a href="index.html" className="flex items-center gap-3">
            <img src="logofinal.png" alt="Ferme des Val'Lands" className="w-9 h-9 object-contain" />
            <span className="font-display text-base leading-none hidden sm:block">Ferme des Val'Lands</span>
          </a>
          <a href="index.html" className="flex items-center gap-1.5 text-cream-100/70 hover:text-cream-50 text-sm transition">
            <Icon name="ArrowLeft" size={15} /> Retour au site
          </a>
        </div>
      </header>

      {/* ── Bandeau erreur stock ── */}
      {stockError && (
        <div className="bg-cream-200 border-b border-earth-300 px-6 py-3 text-sm text-earth-700 flex items-center justify-center gap-2">
          <Icon name="AlertTriangle" size={15} />
          Stocks non disponibles en temps réel — vous pouvez tout de même envoyer votre demande.
        </div>
      )}

      <main className="max-w-3xl mx-auto px-6 lg:px-8 py-12 lg:py-16">

        {/* ── Titre ── */}
        <div className="mb-12">
          <div className="text-xs uppercase tracking-[0.3em] text-terracotta-500 flex items-center gap-3 mb-4">
            <span className="w-5 h-px bg-terracotta-400" />
            Formulaire de commande · Saison 2026
          </div>
          <h1 className="font-display text-4xl lg:text-5xl text-forest-900 leading-[1.05] tracking-tight">
            Réservez votre<br />
            <span className="italic">caissette 2026.</span>
          </h1>
          <p className="mt-4 text-earth-600 text-lg leading-relaxed max-w-xl">
            Remplissez le formulaire. Nous vous confirmons la réservation sous 48 h
            avec les modalités de paiement — aucun paiement sur ce site.
          </p>
        </div>

        <form onSubmit={handleSubmit} noValidate className="space-y-12">

          {/* ══ Section 1 : Coordonnées ══════════════════════════════════════ */}
          <section>
            <h2 className="font-display text-2xl text-forest-800 pb-3 border-b border-earth-200 mb-7 flex items-center gap-3">
              <span className="w-7 h-7 rounded-full bg-forest-900 text-cream-50 text-xs font-sans font-semibold inline-flex items-center justify-center">1</span>
              Vos coordonnées
            </h2>
            <div className="grid sm:grid-cols-2 gap-5">
              <Field label="Prénom"    name="prenom"    value={prenom}    onChange={setPrenom}    error={errors.prenom}    required placeholder="Marie"          autoComplete="given-name"  />
              <Field label="Nom"       name="nom"       value={nom}       onChange={setNom}       error={errors.nom}       required placeholder="Dupont"          autoComplete="family-name" />
              <Field label="Email"     name="email"     type="email"      value={email}     onChange={setEmail}     error={errors.email}     required placeholder="marie@exemple.fr"  autoComplete="email"       />
              <Field label="Téléphone" name="telephone" type="tel"        value={telephone} onChange={setTelephone} error={errors.telephone} required placeholder="06 12 34 56 78"  autoComplete="tel"         />
            </div>
          </section>

          {/* ══ Section 2 : Commande ═════════════════════════════════════════ */}
          <section>
            <h2 className="font-display text-2xl text-forest-800 pb-3 border-b border-earth-200 mb-7 flex items-center gap-3">
              <span className="w-7 h-7 rounded-full bg-forest-900 text-cream-50 text-xs font-sans font-semibold inline-flex items-center justify-center">2</span>
              Votre commande
            </h2>

            {errors.produit && (
              <div className="mb-6 flex items-start gap-2.5 bg-terracotta-50 border border-terracotta-200 text-terracotta-700 text-sm px-4 py-3 rounded-lg">
                <Icon name="AlertCircle" size={15} />
                {errors.produit}
              </div>
            )}

            {/* Caissettes */}
            <div className="mb-8">
              <h3 className="text-[11px] font-semibold uppercase tracking-[0.25em] text-earth-500 mb-4 flex items-center gap-2">
                <Icon name="Package" size={13} strokeWidth={1.8} />
                Caissettes de viande Highland
              </h3>
              <div className="grid sm:grid-cols-3 gap-4">
                {CAISSETTES.map(p => (
                  <CaissetteCard
                    key={p.id}
                    product={p}
                    stock={stock}
                    loading={stockLoading}
                    selected={caissette}
                    onSelect={setCaissette}
                  />
                ))}
              </div>
              <p className="mt-3 text-xs text-earth-400 flex items-center gap-1.5">
                <Icon name="Info" size={12} /> Sélectionnez une seule caissette — ou aucune si vous ne prenez que des steaks.
              </p>
            </div>

            {/* Steaks hachés */}
            <div className="p-6 rounded-xl border-2 border-earth-200 bg-white">
              <div className="flex items-start justify-between gap-4 flex-wrap mb-5">
                <div>
                  <h3 className="font-display text-xl text-forest-900 leading-tight">Steaks hachés Highland</h3>
                  <p className="text-sm text-earth-500 mt-1">Pack de 4 × 150 g · ≈ 12 € / pack</p>
                </div>
                <StockBadge qty={stockLoading ? null : steakQty} loading={stockLoading} />
              </div>
              <QuantityStepper
                value={steaks}
                onChange={setSteaks}
                max={steakQty}
                disabled={stockLoading || steakQty === 0}
              />
            </div>
          </section>

          {/* ══ Section 3 : RGPD ════════════════════════════════════════════ */}
          <section>
            <h2 className="font-display text-2xl text-forest-800 pb-3 border-b border-earth-200 mb-7 flex items-center gap-3">
              <span className="w-7 h-7 rounded-full bg-forest-900 text-cream-50 text-xs font-sans font-semibold inline-flex items-center justify-center">3</span>
              Communications
            </h2>

            {/* Checkbox newsletter */}
            <label className="flex items-start gap-3.5 cursor-pointer group select-none">
              <div className="relative mt-0.5 shrink-0">
                <input
                  type="checkbox"
                  checked={newsletterConsent}
                  onChange={e => setNewsletterConsent(e.target.checked)}
                  className="sr-only"
                />
                <div className={[
                  "w-5 h-5 rounded border-2 flex items-center justify-center transition-all",
                  newsletterConsent
                    ? "bg-forest-600 border-forest-600"
                    : "border-earth-300 bg-white group-hover:border-forest-400",
                ].join(" ")}>
                  {newsletterConsent && <Icon name="Check" size={11} className="text-white" />}
                </div>
              </div>
              <span className="text-sm text-earth-800 leading-relaxed">
                J'accepte de recevoir les actualités et les prochaines dates de vente
                de la Ferme des Val'Lands par email.
              </span>
            </label>

            {/* Mention légale RGPD */}
            <div className="mt-5 ml-8 pl-4 border-l-2 border-earth-200">
              <p className="text-[12px] text-earth-400 leading-relaxed">
                Vos données (nom, prénom, email, téléphone) sont collectées uniquement pour traiter
                votre commande et, si vous y consentez, pour vous informer de nos actualités.
                Elles ne sont jamais transmises à des tiers. Conformément au{" "}
                <strong className="font-medium">Règlement Général sur la Protection des Données (RGPD)</strong>,
                vous disposez d'un droit d'accès, de rectification et de suppression, exerçable à
                tout moment en écrivant à{" "}
                <a href="mailto:bonjour@val-lands.fr" className="underline hover:text-earth-600 transition">
                  bonjour@val-lands.fr
                </a>.
                Si vous avez coché la case ci-dessus, vous pourrez vous désabonner en un clic
                depuis chaque email reçu.
              </p>
            </div>
          </section>

          {/* ══ Erreur soumission ════════════════════════════════════════════ */}
          {errors.submit && (
            <div className="flex items-start gap-3 bg-terracotta-50 border border-terracotta-200 text-terracotta-700 text-sm px-5 py-4 rounded-xl">
              <Icon name="AlertTriangle" size={16} />
              {errors.submit}
            </div>
          )}

          {/* ══ Bouton d'envoi ═══════════════════════════════════════════════ */}
          <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5 pt-2">
            <button
              type="submit"
              disabled={submitting}
              className="group inline-flex items-center gap-4 bg-forest-800 hover:bg-forest-900 disabled:opacity-60 disabled:cursor-not-allowed text-cream-50 pl-7 pr-4 py-4 rounded-full text-base font-medium tracking-tight transition shadow-lg shadow-forest-900/20"
            >
              {submitting ? (
                <>
                  <span>Envoi en cours…</span>
                  <span className="w-10 h-10 rounded-full bg-white/10 inline-flex items-center justify-center animate-spin">
                    <Icon name="Loader2" size={18} />
                  </span>
                </>
              ) : (
                <>
                  <span>Envoyer ma réservation</span>
                  <span className="w-10 h-10 rounded-full bg-terracotta-500 text-cream-50 inline-flex items-center justify-center transition group-hover:scale-105 group-hover:rotate-[-6deg]">
                    <Icon name="ArrowRight" size={18} />
                  </span>
                </>
              )}
            </button>

            <div className="flex items-center gap-2 text-sm text-earth-500">
              <Icon name="ShieldCheck" size={15} strokeWidth={1.4} />
              Aucun paiement — confirmation par email ou téléphone
            </div>
          </div>

        </form>
      </main>

      <footer className="bg-forest-900 text-cream-100/50 py-6 mt-16 text-center text-xs">
        © 2026 Ferme des Val'Lands ·{" "}
        <a href="mailto:bonjour@val-lands.fr" className="hover:text-cream-100 transition">bonjour@val-lands.fr</a>
        {" "}· 04 71 ·· ·· ··
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<OrderForm />);
</script>
</body>
</html>
