const { useEffect, useRef, useState } = React;

// ---------- Lucide helper ----------
const Icon = ({ name, className = "", size = 20, strokeWidth = 1.6 }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[name]);
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.setAttribute("stroke-width", strokeWidth);
      svg.setAttribute("class", className);
      ref.current.appendChild(svg);
    }
  }, [name, className, size, strokeWidth]);
  return <span ref={ref} className="inline-flex" aria-hidden="true" />;
};

// ---------- Reveal on scroll ----------
const Reveal = ({ children, className = "", delay = 0 }) => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          setTimeout(() => el.classList.add("in"), delay);
          io.unobserve(el);
        }
      });
    }, { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);
  return <div ref={ref} className={`reveal-up ${className}`}>{children}</div>;
};
